name: Release

on:
  release:
    types: [created]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      # GoReleaser drops `brews` in v3: the formulas are generated from its
      # output and pushed to the tap. A pre-release never touches the tap.
      - name: Checkout the tap
        if: ${{ !github.event.release.prerelease }}
        uses: actions/checkout@v7
        with:
          repository: beliven-it/homebrew-tap
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: tap
      - name: Publish Homebrew formulas
        if: ${{ !github.event.release.prerelease }}
        run: |
          scripts/homebrew-formula.sh dist tap/Formula
          version="$(jq -r '.version' dist/metadata.json)"
          cd tap
          git add Formula
          if git diff --cached --quiet; then
            echo "The tap already has the formulas of opsi $version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Brew formula update for opsi version $version"
          git push

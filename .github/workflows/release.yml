name: Release

on:
  release:
    types: [created]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      # GoReleaser drops `brews` in v3: generate the formulas ourselves and
      # check they match. Once they always do, `brews` can be replaced by a push.
      - name: Check generated Homebrew formulas
        run: |
          scripts/homebrew-formula.sh dist "$RUNNER_TEMP/formulas"
          diff -ru dist/homebrew/Formula "$RUNNER_TEMP/formulas"
